name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Scanning lives in nox-scan.yml, using the SHA-pinned nox-hq/nox action the
# other plugin repositories use. This workflow is lint / test / conformance /
# build only, so it needs no security-events permission.
permissions:
  contents: read

jobs:
  ci:
    uses: nox-hq/.github/.github/workflows/plugin-ci.yml@main
    with:
      go-version: '1.25'
      run-conformance: true
