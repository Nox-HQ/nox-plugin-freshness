# Dependabot replacement. Weekly (and on-demand) OSV dependency upgrades plus
# GitHub Actions pin bumps, opened as one PR and auto-merged when CI is green.
# Delegates to the central felixgeelhaar/.github reusable workflow, matching
# the rest of the fleet.
name: Nox Remediate

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  # nox:ignore IAC-308 -- workflow_dispatch is how a remediation run is triggered off-schedule.
  workflow_dispatch: {}

permissions:
  # nox:ignore IAC-314 -- write access to repository contents is required to push the remediation branch; that is the workflow's whole purpose.
  contents: write
  pull-requests: write

jobs:
  remediate:
    uses: felixgeelhaar/.github/.github/workflows/nox-remediate.yml@main
    secrets: inherit # passes NOX_TOKEN through when defined (needed to bump action pins)
