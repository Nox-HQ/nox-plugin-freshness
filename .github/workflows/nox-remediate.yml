# Dependabot replacement. Weekly (and on-demand) OSV dependency upgrades plus
# GitHub Actions pin bumps, opened as one PR and auto-merged when CI is green.
#
# Calls the Nox-HQ reusable workflow rather than the felixgeelhaar one. That is
# not cosmetic: `secrets: inherit` only passes secrets to reusable workflows in
# the same organisation, so a Nox-HQ repository calling a felixgeelhaar
# workflow would inherit nothing — silently — and the run would fall back to
# GITHUB_TOKEN, which cannot open pull requests. klarlabs-studio/roady lost two
# weeks of remediation to exactly that.
name: Nox Remediate

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  # nox:ignore IAC-308 -- workflow_dispatch is how a remediation run is triggered off-schedule.
  workflow_dispatch: {}

permissions:
  # nox:ignore IAC-314 -- write access to repository contents is required to push the remediation branch; that is the workflow's whole purpose.
  contents: write
  pull-requests: write

jobs:
  remediate:
    uses: nox-hq/.github/.github/workflows/nox-remediate.yml@main
    secrets: inherit # same org, so the Nox-HQ NOX_TOKEN reaches the called workflow
