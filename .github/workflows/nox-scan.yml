# Nox self-scan, matching the twenty-one sibling plugin repositories.
#
# This replaces a hand-rolled version that downloaded the nox tarball, verified
# a sha256, installed cosign and reimplemented a baseline gate in shell. The
# fleet already had a better answer and this repo was the odd one out:
#
#   - nox-hq/nox is pinned by commit SHA, so there is no tarball digest to bump
#     by hand and get wrong.
#   - The PR gate scans changed files only, at high severity, rather than
#     diffing a full scan against a committed baseline. That sidesteps
#     fingerprint stability entirely — nox/taint-analysis fingerprints vary
#     with the scan directory (nox-hq/nox-plugin-taint-analysis#37), which
#     makes a baselined finding valid only on the machine that produced it.
#
# The push scan reports without failing; the PR gate is what blocks.
name: Nox Security Scan

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # nox:ignore IAC-309 -- deliberate on a scan workflow: a superseded push should not keep burning a runner.
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  nox-scan:
    name: Nox Self-Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Nox
        uses: nox-hq/nox@54b9bb3acbf4d250595271a2c06cfee4eb441ee9 # v1.26.0
        with:
          path: .
          format: sarif,json
          output: nox-results
          fail-on-findings: 'false'
          # A check that could not complete — an OSV lookup, a lockfile parse,
          # a plugin — is not a clean result. This is the action's own framing
          # and it is the right one.
          fail-on-degraded: 'true'

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@33119e582d3ab4ed79c2610af108cb08ff983917 # v3
        if: always()
        with:
          sarif_file: nox-results/results.sarif
        # nox:ignore IAC-018 -- SARIF upload is best-effort by design; a code-scanning outage must not fail the security job that produced the findings.
        continue-on-error: true

      - name: Upload scan artifact
        # nox:ignore IAC-153 -- the artifact is scan output for debugging, not a distributed build product; release binaries are what warrant attestation.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nox-results
          path: nox-results/
          if-no-files-found: warn

  nox-pr-gate:
    name: Nox PR Gate (high/critical)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Nox (changed files only)
        uses: nox-hq/nox@54b9bb3acbf4d250595271a2c06cfee4eb441ee9 # v1.26.0
        with:
          path: .
          format: sarif,json
          output: nox-pr
          fail-on-findings: 'true'
          severity-threshold: high
          changed-since: origin/${{ github.base_ref }}
          fail-on-degraded: 'true'

      - name: Upload SARIF (PR-scoped)
        uses: github/codeql-action/upload-sarif@33119e582d3ab4ed79c2610af108cb08ff983917 # v3
        if: always()
        with:
          sarif_file: nox-pr/results.sarif
          category: nox-pr
        # nox:ignore IAC-018 -- as above: the PR-scoped SARIF upload is best-effort; the gate itself is what blocks.
        continue-on-error: true
